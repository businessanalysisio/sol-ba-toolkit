# Sol retrieval infrastructure.
#
#   qdrant — vector store. Holds one embedding per chunk of the corpus and
#            returns a similarity score per hit. That score is what the source
#            panel's confidence threshold is measured against, so it has to come
#            from here rather than be asserted by the app.
#
#   neo4j  — link graph. Holds the LLM-Wiki's [[wikilink]] edges and the
#            requirement → goal → test chain. Both are graph questions
#            ("what links here", "what is uncovered two hops out") that are
#            awkward in SQL and native in Cypher.
#
# Postgres/Supabase stays the system of record for requirements. Neither service
# here is authoritative: both are derived from the wiki and the register, and
# both can be rebuilt from scratch by re-running ingestion.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sol-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # Qdrant's image has no shell utilities, so probe from the app side instead
      # of assuming curl exists in the container.
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 3s
      retries: 3

  neo4j:
    image: neo4j:5.26-community
    container_name: sol-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      # Dev-only credentials. Override NEO4J_PASSWORD in .env.local before this
      # is ever reachable from anything but localhost.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-sol-local-dev}"
      NEO4J_server_memory_heap_max__size: "512M"
      NEO4J_server_memory_pagecache_size: "256M"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant-storage:
  neo4j-data:
  neo4j-logs:
